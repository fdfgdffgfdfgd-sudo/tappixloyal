services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
      api: {condition: service_healthy}

  web:
    image: ${TAPPIX_WEB_IMAGE:?immutable TAPPIX_WEB_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    expose: ["3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  api:
    image: ${TAPPIX_API_IMAGE:?immutable TAPPIX_API_IMAGE is required}
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required}
    expose: ["8080"]
    volumes:
      - tappix_uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infrastructure/secrets/metrics_token:/run/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  tappix_uploads:
