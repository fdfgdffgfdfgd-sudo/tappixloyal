name: Tappix CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tappix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: apps/api/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test API
        working-directory: apps/api
        run: go test ./...

      - name: Check API formatting
        working-directory: apps/api
        run: test -z "$(gofmt -l .)"

      - name: Test frontend
        run: npm run test:unit

      - name: Lint frontend
        run: npm run lint

      - name: Check design tokens
        run: npm run test:tokens

      - name: Build frontend
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Apply database migrations
        run: TAPPIX_SEED_DEMO=1 npm run db:migrate

      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Run integration tests
        run: npm run test:integration

      - name: Run security and RBAC audit
        run: npm run test:security

      - name: Verify backup and isolated restore
        run: npm run test:backup

      - name: Run load smoke test
        env:
          VUS: 2
          DURATION: 10s
        run: npm run test:load

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Apply database migrations
        run: TAPPIX_SEED_DEMO=1 npm run db:migrate

      - name: Wait for web
        run: |
          for attempt in $(seq 1 40); do
            curl -fsS http://localhost:8088/login >/dev/null && exit 0
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
