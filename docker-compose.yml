services:
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["${TAPPIX_PORT:-8088}:80"]
    volumes: ["./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      web: {condition: service_healthy}
      api: {condition: service_healthy}
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/business/Dockerfile
      args: {NEXT_PUBLIC_API_URL: /api/v1}
    environment: {NODE_ENV: production, PORT: 3000}
    expose: ["3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
  api:
    restart: unless-stopped
    build: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-tappix}:${POSTGRES_PASSWORD:-tappix_local}@postgres:5432/${POSTGRES_DB:-tappix}?sslmode=disable
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-before-production}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-Tappix <noreply@tappix.kz>}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      APP_URL: ${APP_URL:-http://localhost:8088}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-tappix_login_code}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v23.0}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      UPLOAD_DIR: /data/uploads
      HTTP_ADDR: :8080
    ports: ["${API_PORT:-8080}:8080"]
    volumes: ["tappix_uploads:/data/uploads"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tappix}
      POSTGRES_USER: ${POSTGRES_USER:-tappix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tappix_local}
    ports: ["5432:5432"]
    volumes: ["tappix_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tappix} -d ${POSTGRES_DB:-tappix}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tappix_postgres:
  tappix_uploads:
